spring:
  application:
    name: springstudy

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/springstudy;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      encoding: UTF-8
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload-dir: uploads

logging:
  level:
    com.example.springstudy.service.MemberService: INFO
    com.example.springstudy.controller.MemberController: INFO
